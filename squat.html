<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQUAT CHALLENGE NU</title>
<style>
  :root {
    --purple-dark: #2a0845;
    --purple: #582c83;
    --purple-light: #b48ce6;
    --gold: #f2c75c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    background: linear-gradient(160deg, var(--purple-dark), var(--purple) 60%, #7b3fb5);
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 48px 16px 24px;
  }
  h1 {
    margin: 0;
    font-size: clamp(2.2rem, 8vw, 5rem);
    font-weight: 900;
    letter-spacing: 0.06em;
    text-shadow: 0 4px 0 var(--purple-dark), 0 0 24px var(--purple-light);
  }
  .tagline {
    margin-top: 12px;
    font-size: 1.2rem;
    color: var(--purple-light);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  /* Camera capture */
  .camera {
    max-width: 720px;
    margin: 0 auto;
    padding: 8px 16px 0;
    text-align: center;
  }
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: rgba(0, 0, 0, 0.35);
    border: 2px solid var(--purple-light);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  .stage video,
  .stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* mirror, like a selfie camera */
  }
  .stage .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: var(--purple-light);
  }
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .controls button {
    font: inherit;
    font-weight: bold;
    padding: 10px 22px;
    border-radius: 999px;
    border: 2px solid var(--gold);
    background: var(--gold);
    color: var(--purple-dark);
    cursor: pointer;
  }
  .controls button.secondary {
    background: transparent;
    color: var(--gold);
  }
  .controls button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .status {
    min-height: 1.4em;
    margin-top: 10px;
    color: var(--purple-light);
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  figure {
    margin: 0;
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid var(--purple-light);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  figure img {
    display: block;
    width: 100%;
    height: 260px;
    object-fit: cover;
  }
  /* Human figure illustrations */
  .person {
    display: block;
    width: 100%;
    height: 260px;
    fill: none;
    stroke: var(--gold);
    stroke-width: 9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .person .ground {
    stroke: var(--purple-light);
    stroke-width: 4;
  }
  figcaption {
    padding: 10px 14px;
    text-align: center;
    font-weight: bold;
    color: var(--gold);
  }
  footer {
    text-align: center;
    padding: 16px;
    color: var(--purple-light);
  }
  footer a { color: var(--gold); }
</style>
</head>
<body>

<header>
  <h1>SQUAT CHALLENGE NU</h1>
  <div class="tagline">Go Purple Eagles!</div>
</header>

<section class="camera">
  <div class="stage">
    <video id="video" playsinline muted hidden></video>
    <canvas id="overlay" hidden></canvas>
    <div class="placeholder" id="placeholder">Press “Start camera” to begin</div>
  </div>
  <div class="controls">
    <button id="startBtn">Start camera</button>
    <button id="stopBtn" class="secondary" disabled>Stop</button>
  </div>
  <div class="status" id="status"></div>
</section>

<main class="gallery">
  <figure>
    <svg class="person" viewBox="0 0 200 260" role="img" aria-label="A person standing upright">
      <line class="ground" x1="40" y1="238" x2="160" y2="238"/>
      <circle cx="100" cy="40" r="18"/>
      <line x1="100" y1="60" x2="100" y2="140"/>
      <polyline points="100,74 82,108 78,138"/>
      <polyline points="100,74 118,108 122,138"/>
      <polyline points="100,140 92,188 90,234 76,236"/>
      <polyline points="100,140 108,188 110,234 124,236"/>
    </svg>
    <figcaption>Standing</figcaption>
  </figure>
  <figure>
    <svg class="person" viewBox="0 0 200 260" role="img" aria-label="A person in a deep squat with arms reaching forward">
      <line class="ground" x1="40" y1="238" x2="160" y2="238"/>
      <circle cx="112" cy="84" r="18"/>
      <line x1="104" y1="104" x2="78" y2="178"/>
      <polyline points="100,116 132,124 164,124"/>
      <polyline points="78,178 132,186 104,234 132,236"/>
    </svg>
    <figcaption>Squatting</figcaption>
  </figure>
  <figure>
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/ab/3Falls_Niagara.jpg" alt="Panoramic view of Niagara Falls">
    <figcaption>Niagara Falls</figcaption>
  </figure>
  <figure>
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/American_Falls_Niagara_Falls_USA_from_Skylon_Tower_on_2002-05-28_crop.png" alt="American Falls at Niagara Falls seen from Skylon Tower">
    <figcaption>American Falls</figcaption>
  </figure>
</main>

<footer>
  <a href="https://niagara.edu">Niagara University</a>
</footer>

<script>
(() => {
  const video = document.getElementById('video');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const placeholder = document.getElementById('placeholder');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const status = document.getElementById('status');

  let stream = null;
  let rafId = null;

  // Called once per video frame while the camera is running.
  // Hook MediaPipe in here later, e.g.:
  //   const result = poseLandmarker.detectForVideo(video, timestamp);
  //   ...draw result.landmarks onto ctx...
  function onFrame(video, ctx, timestamp) {
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  }

  function loop(timestamp) {
    if (!stream) return;
    if (video.readyState >= 2) onFrame(video, ctx, timestamp);
    rafId = requestAnimationFrame(loop);
  }

  async function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      status.textContent = 'This browser does not support camera access (it needs https or localhost).';
      return;
    }
    startBtn.disabled = true;
    status.textContent = 'Requesting camera…';
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
    } catch (err) {
      stream = null;
      startBtn.disabled = false;
      status.textContent = err.name === 'NotAllowedError'
        ? 'Camera permission was denied. Allow it in your browser settings and try again.'
        : 'Could not start the camera: ' + err.message;
      return;
    }
    video.srcObject = stream;
    await video.play();
    // Match the drawing surface to the real camera resolution.
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    video.hidden = false;
    canvas.hidden = false;
    placeholder.hidden = true;
    stopBtn.disabled = false;
    status.textContent = 'Camera on (' + video.videoWidth + '×' + video.videoHeight + ')';
    rafId = requestAnimationFrame(loop);
  }

  function stop() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    video.srcObject = null;
    video.hidden = true;
    canvas.hidden = true;
    placeholder.hidden = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    status.textContent = 'Camera off';
  }

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
})();
</script>

</body>
</html>
