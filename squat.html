<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQUAT CHALLENGE NU</title>
<style>
  :root {
    --purple-dark: #2a0845;
    --purple: #582c83;
    --purple-light: #b48ce6;
    --gold: #f2c75c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    background: linear-gradient(160deg, var(--purple-dark), var(--purple) 60%, #7b3fb5);
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 48px 16px 24px;
  }
  h1 {
    margin: 0;
    font-size: clamp(2.2rem, 8vw, 5rem);
    font-weight: 900;
    letter-spacing: 0.06em;
    text-shadow: 0 4px 0 var(--purple-dark), 0 0 24px var(--purple-light);
  }
  .tagline {
    margin-top: 12px;
    font-size: 1.2rem;
    color: var(--purple-light);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  figure {
    margin: 0;
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid var(--purple-light);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  figure img {
    display: block;
    width: 100%;
    height: 260px;
    object-fit: cover;
  }
  /* Tint a regular bald eagle photo purple */
  .purpleize {
    filter: sepia(1) hue-rotate(225deg) saturate(3);
  }
  figcaption {
    padding: 10px 14px;
    text-align: center;
    font-weight: bold;
    color: var(--gold);
  }
  footer {
    text-align: center;
    padding: 16px;
    color: var(--purple-light);
  }
  footer a { color: var(--gold); }
</style>
</head>
<body>

<header>
  <h1>SQUAT CHALLENGE NU</h1>
  <div class="tagline">Go Purple Eagles!</div>
</header>

<main class="gallery">
  <figure>
    <img src="https://thumbs.dreamstime.com/b/eagle-symbol-strength-freedom-purple-plumage-adds-touch-royalty-to-its-already-majestic-appearance-278442740.jpg" alt="A majestic eagle with purple plumage">
    <figcaption>Purple Eagle</figcaption>
  </figure>
  <figure>
    <img class="purpleize" src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Bald_eagle_about_to_fly_in_Alaska_%282016%29.jpg/1280px-Bald_eagle_about_to_fly_in_Alaska_%282016%29.jpg" alt="An eagle about to take flight, tinted purple">
    <figcaption>Purple Eagle Taking Flight</figcaption>
  </figure>
  <figure>
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/ab/3Falls_Niagara.jpg" alt="Panoramic view of Niagara Falls">
    <figcaption>Niagara Falls</figcaption>
  </figure>
  <figure>
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/American_Falls_Niagara_Falls_USA_from_Skylon_Tower_on_2002-05-28_crop.png" alt="American Falls at Niagara Falls seen from Skylon Tower">
    <figcaption>American Falls</figcaption>
  </figure>
</main>

<footer>
  <a href="https://niagara.edu">Niagara University</a>
</footer>

</body>
</html>
